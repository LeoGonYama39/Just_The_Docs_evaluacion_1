title: Just_The_Docs_evaluacion_1
description: Just The Docs para documentar la evaluación 1 de Control Inteligente, otoño 2026.

# GitHub Pages: modo recomendado
remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

url: "https://LeoGonYama39.github.io/"
baseurl: "/Just_The_Docs_evaluacion_1"

#Configuracion Formato, Header y Footer
just_the_docs:
  # incluir CSS adicional
  custom_css:
    - "assets/css/custom.css"
  footer_content: ""

search_enabled: true
search:
  # Cambia el numero dependiendo el numero de subniveles de páginas, poner 1 por default
  heading_level: 2

# Ejemplo de enlace auxiliar (aparece arriba a la derecha)
aux_links:
  "Repositorio del proyecto (GitHub) ":
    - "https://github.com/jbbarragan/RoboMaster_Vicon_Python"

# Enlaces
permalink: pretty

exclude:
  - "Gemfile"
  - "Gemfile.lock"
  - "node_modules"
  - "vendor"
